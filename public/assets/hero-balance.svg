<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A golden balance settling level" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#F3DFA3" stop-opacity=".75"/>
      <stop offset="1" stop-color="#F6F1E7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D587"/><stop offset=".5" stop-color="#C9A24B"/><stop offset="1" stop-color="#9C7220"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A261F"/><stop offset="1" stop-color="#15130F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".6" fill="#15130F" opacity=".05"/><circle cx="4" cy="4" r=".5" fill="#8E1B1B" opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#F6F1E7"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <!-- faint bahi-khata ruled lines -->
  <g stroke="#8E1B1B" stroke-opacity=".08">
    <path d="M0 780H1600M0 820H1600M0 860H1600"/><path d="M120 0V900" stroke-opacity=".12"/>
  </g>
  <!-- shadow -->
  <ellipse cx="800" cy="788" rx="300" ry="16" fill="#15130F" opacity=".18" filter="url(#soft)"/>
  <!-- post + base -->
  <path d="M760 790 H840 L828 760 H772Z" fill="url(#ink)"/>
  <rect x="790" y="310" width="20" height="452" rx="8" fill="url(#ink)"/>
  <!-- beam group (tilts then settles level) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="5s" fill="freeze"
      values="-6 800 300;4 800 300;-2 800 300;0 800 300" keyTimes="0;.35;.7;1" calcMode="spline"
      keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    <rect x="280" y="290" width="1040" height="20" rx="10" fill="url(#gold)"/>
    <circle cx="280" cy="300" r="14" fill="url(#gold)"/><circle cx="1320" cy="300" r="14" fill="url(#gold)"/>
  </g>
  <!-- fulcrum -->
  <circle cx="800" cy="300" r="40" fill="url(#gold)"/><circle cx="800" cy="300" r="15" fill="#F6F1E7"/>
  <!-- left pan -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="5s" fill="freeze"
      values="0 54;0 -36;0 18;0 0" keyTimes="0;.35;.7;1" calcMode="spline"
      keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    <path d="M280 300 L180 560 M280 300 L380 560" stroke="#15130F" stroke-width="4" stroke-linecap="round"/>
    <path d="M150 560 A130 130 0 0 0 410 560Z" fill="url(#gold)"/>
    <ellipse cx="280" cy="560" rx="130" ry="9" fill="#9C7220" opacity=".5"/>
    <g fill="#F0D587" stroke="#9C7220" stroke-width="2"><circle cx="240" cy="545" r="16"/><circle cx="282" cy="540" r="18"/><circle cx="326" cy="546" r="15"/><circle cx="262" cy="518" r="14"/><circle cx="304" cy="516" r="13"/></g>
  </g>
  <!-- right pan -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="5s" fill="freeze"
      values="0 -54;0 36;0 -18;0 0" keyTimes="0;.35;.7;1" calcMode="spline"
      keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    <path d="M1320 300 L1220 560 M1320 300 L1420 560" stroke="#15130F" stroke-width="4" stroke-linecap="round"/>
    <path d="M1190 560 A130 130 0 0 0 1450 560Z" fill="url(#gold)"/>
    <ellipse cx="1320" cy="560" rx="130" ry="9" fill="#9C7220" opacity=".5"/>
    <g fill="#F0D587" stroke="#9C7220" stroke-width="2"><circle cx="1282" cy="546" r="15"/><circle cx="1322" cy="541" r="17"/><circle cx="1364" cy="547" r="14"/><circle cx="1302" cy="520" r="12"/><circle cx="1344" cy="518" r="11"/></g>
    <!-- recovered scrap + loss: smaller dust -->
    <g fill="#C9A24B" opacity=".85"><circle cx="1262" cy="536" r="6"/><circle cx="1384" cy="538" r="5"/><circle cx="1330" cy="500" r="4"/></g>
  </g>
  <!-- labels -->
  <g font-family="Fraunces, Georgia, serif" fill="#15130F" text-anchor="middle">
    <text x="280" y="846" font-size="28" opacity=".75">Issued</text>
    <text x="1320" y="846" font-size="28" opacity=".75">Returned + scrap + loss</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
